# Compose override for the Azure VM: the services use the managed Postgres instead of the local container.
#   docker compose -f docker-compose.yml -f infra/azure/docker-compose.azure.yml up -d
# The database parts were derived from docker-compose.yml by reading which services use DATABASE_URL or wait for the postgres service; redo them if those change.
# Needs these in the environment (.env), taken from Key Vault, never committed:
#   ACORN_BIND_IP                 the VM's private address (10.20.1.4): the API and web are published on it, never on 0.0.0.0, so CORE and a VPN can reach them and the internet cannot
#   AZURE_DATABASE_URL            postgresql+asyncpg://aisoc_app:<aisoc-app-db-password>@<postgres host>:5432/aisoc   (the limited account: row-level security applies; NO ?ssl= here, see PGSSLMODE below)
#   AZURE_MIGRATION_DATABASE_URL  postgresql+asyncpg://liveoakadmin:<postgres-admin-password>@<postgres host>:5432/aisoc?ssl=require   (the owner: migrations change the schema)
services:
  litellm:
    # The Azure gateway config lives outside the repository (it points at the CORE VM's Claude link), so an update from git never overwrites it.
    volumes: !override
      - /srv/acorn/config/litellm.yaml:/etc/litellm/config.yaml:ro
  web:
    ports: !override
      - "${ACORN_BIND_IP:-127.0.0.1}:3000:3000"
  caddy:
    # https in front of the web container (Microsoft sign-in needs an https address). Published only on the private address.
    build: ./infra/azure/caddy
    restart: unless-stopped
    ports:
      - "${ACORN_BIND_IP:-127.0.0.1}:443:443"
    env_file:
      - /srv/acorn/caddy/cloudflare.env
    volumes:
      - ./infra/azure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/acorn/caddy/data:/data
    networks:
      - aisoc
    depends_on:
      - web
  postgres:
    profiles: ["local-db"]   # not started on the Azure VM
  api:
    ports: !override
      - "${ACORN_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
      MIGRATION_DATABASE_URL: ${AZURE_MIGRATION_DATABASE_URL:?set AZURE_MIGRATION_DATABASE_URL}
      ACORN_UPDATE_CTL_DIR: /update-ctl   # the Update button's hand-off folder (see acorn-update-runner.sh)
      MS_SSO_TENANT_ID: ${MS_SSO_TENANT_ID:-}   # Sign in with Microsoft: all four of the first four stay empty = the button is not shown (see docs/SSO_MICROSOFT.md)
      MS_SSO_CLIENT_ID: ${MS_SSO_CLIENT_ID:-}
      MS_SSO_CLIENT_SECRET: ${MS_SSO_CLIENT_SECRET:-}
      MS_SSO_REDIRECT_URI: ${MS_SSO_REDIRECT_URI:-}
      MS_SSO_GROUP_ID: ${MS_SSO_GROUP_ID:-}
      MS_SSO_ACORN_TENANT_ID: ${MS_SSO_ACORN_TENANT_ID:-}
      MS_SSO_NEW_USER_ROLE: ${MS_SSO_NEW_USER_ROLE:-viewer}
      MS_SSO_PASSWORD_LOGIN: ${MS_SSO_PASSWORD_LOGIN:-admins}
      MS_SSO_WEB_URL: ${MS_SSO_WEB_URL:-}
      ACORN_AZURE_SPEND_SCOPE: /subscriptions/34497679-4e8a-41d5-a9ae-a3e03c24981f/resourceGroups/rg-liveoak-ops   # Settings > Azure spend reads costs here (read-only, VM identity)
    volumes:
      - /srv/acorn/update-ctl:/update-ctl
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  fusion:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
  agents:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  osquery-tls:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
    depends_on: !reset null
  actions:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  connectors:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
  ueba:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  honeytokens:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  purple-team:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      PGSSLMODE: require   # encryption is required through this setting, not through ?ssl= in the address: services that open raw asyncpg connections cannot read that
    depends_on: !override
      redis:
        condition: service_healthy
  ingest-worker:
    # CORE (on its own VM) forwards vendor alerts to this intake service, so it is published on the private address like the API and web, never on 0.0.0.0.
    ports: !override
      - "${ACORN_BIND_IP:-127.0.0.1}:8081:8080"
      - "127.0.0.1:9090:9090"
    environment:
      # The intake looks up each sender's push token in the database ACROSS clients (it needs a role that is not limited by row-level security), so it uses the owner connection
      # (update-acorn.sh derives this from AZURE_MIGRATION_DATABASE_URL when it is missing). Without it the intake answers "temporary lookup failure" and no vendor alert gets in.
      DATABASE_DSN: ${AZURE_INGEST_DSN:?set AZURE_INGEST_DSN}
    depends_on: !override
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
