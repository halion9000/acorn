# Compose override for the Azure VM: the services use the managed Postgres instead of the local container.
#   docker compose -f docker-compose.yml -f infra/azure/docker-compose.azure.yml up -d
# Generated from docker-compose.yml by reading which services use DATABASE_URL or wait for the postgres service; regenerate it if those change.
# Needs these in the environment (.env), taken from Key Vault, never committed:
#   AZURE_DATABASE_URL            postgresql+asyncpg://aisoc_app:<aisoc-app-db-password>@<postgres host>:5432/aisoc?ssl=require   (the limited account: row-level security applies)
#   AZURE_MIGRATION_DATABASE_URL  postgresql+asyncpg://liveoakadmin:<postgres-admin-password>@<postgres host>:5432/aisoc?ssl=require   (the owner: migrations change the schema)
services:
  postgres:
    profiles: ["local-db"]   # not started on the Azure VM
  api:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
      MIGRATION_DATABASE_URL: ${AZURE_MIGRATION_DATABASE_URL:?set AZURE_MIGRATION_DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  fusion:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
  agents:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  osquery-tls:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
    depends_on: !reset null
  actions:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  connectors:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
  ueba:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  honeytokens:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
  purple-team:
    environment:
      DATABASE_URL: ${AZURE_DATABASE_URL:?set AZURE_DATABASE_URL}
    depends_on: !override
      redis:
        condition: service_healthy
  ingest-worker:
    depends_on: !override
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
